name: Regenerate package-lock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate package-lock.json
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only
          python3 -c "import json; d=json.load(open('package-lock.json')); assert '@vercel/analytics' in json.dumps(d); print('ok', d.get('name'), len(open('package-lock.json').read()))"
      - name: Commit package-lock.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "Update package-lock for @vercel/analytics"
          git push

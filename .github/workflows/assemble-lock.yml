name: Assemble package-lock
on:
  push:
    paths:
      - '.lock-parts/**'
      - '.github/workflows/assemble-lock.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build package-lock.json
        run: |
          set -euo pipefail
          count=$(ls .lock-parts/x* 2>/dev/null | wc -l || true)
          echo "parts=$count"
          if [ "$count" -eq 206 ]; then
            cat .lock-parts/x* | base64 -d | gunzip > package-lock.json
            test "$(wc -c < package-lock.json)" -eq 345008
          else
            npm install --package-lock-only --ignore-scripts
          fi
          python3 -c "import json; d=json.load(open('package-lock.json')); print(d.get('name'), d.get('lockfileVersion'))"
          wc -c package-lock.json
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add remaining project files (batch 2)"
          git push

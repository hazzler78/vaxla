name: Assemble package-lock
on:
  push:
    paths:
      - '.lock-parts/**'
      - '.github/workflows/assemble-lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write package-lock.json
        run: |
          cat .lock-parts/b64.* | base64 -d | gunzip > package-lock.json
          wc -c package-lock.json
          python3 -c "import json; d=json.load(open('package-lock.json')); print(d.get('name'), d.get('lockfileVersion'))"
          test "$(wc -c < package-lock.json)" -eq 345008
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add remaining project files (batch 2)"
          git push
